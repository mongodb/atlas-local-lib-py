[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "atlas_local"

[project]
name = "atlas-local-lib-py"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Docker daemon, so they are opt-in:
# run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: requires a running Docker daemon"]

[tool.ruff]
target-version = "py39"
