[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "atlas_local"

[project]
name = "atlas-local-lib-py"
description = "Python library for managing Atlas local environments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
authors = [{ name = "APIx DevTools team" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mongodb/atlas-local-lib-py"
Repository = "https://github.com/mongodb/atlas-local-lib-py"
Issues = "https://github.com/mongodb/atlas-local-lib-py/issues"

[project.optional-dependencies]
test = ["pytest", "pymongo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Docker daemon, so they are opt-in:
# run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: requires a running Docker daemon"]
