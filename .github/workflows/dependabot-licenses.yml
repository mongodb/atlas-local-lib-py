name: Update third-party licenses

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-third-party-licenses-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-licenses:
    name: Regenerate LICENSE-3RD-PARTY.txt
    runs-on: ubuntu-latest

    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'dependabot/cargo/') ||
        startsWith(github.event.pull_request.head.ref, 'dependabot/pip/')
      )

    env:
      CARGO_ABOUT_VERSION: "0.9.1"

    steps:
      - name: Create APIx bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APIXBOT_APP_ID }}
          private-key: ${{ secrets.APIXBOT_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-license-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-license-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      - name: Install cargo-about
        run: |
          cargo binstall \
            --no-confirm \
            --locked \
            --version "${CARGO_ABOUT_VERSION}" \
            cargo-about

      - name: Install package and Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install . pip-licenses packaging

      - name: Regenerate LICENSE-3RD-PARTY.txt
        run: |
          set -euo pipefail
          PYTHON="$(which python)" ./scripts/generate-third-party.sh

      - name: Commit and push updated licenses
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if git diff --quiet -- LICENSE-3RD-PARTY.txt; then
            echo "LICENSE-3RD-PARTY.txt is already up to date"
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          git add LICENSE-3RD-PARTY.txt
          git commit -m "chore(deps): update LICENSE-3RD-PARTY.txt"
          git push origin "HEAD:${BRANCH}"
