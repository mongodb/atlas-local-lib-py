[package]
authors = ["APIx DevTools team"]
name = "atlas-local-lib-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# This crate ships as a Python wheel (PyPI), never to crates.io.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "atlas_local"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py39", "chrono", "multiple-pymethods"] }
atlas-local = "0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
chrono = "0.4"

# Erase this when a new version of atlas-local is released.
[patch.crates-io]
atlas-local = {
    git = "https://github.com/mongodb/atlas-local-lib",
    rev = "7da5c550b35def921d26c296861ef5399155547f",
}